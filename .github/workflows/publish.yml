name: Verify or publish approved artifact
on:
  workflow_dispatch:
    inputs:
      project:
        description: App to verify or publish
        type: choice
        default: legacy
        options:
          - legacy
          - fitness
          - calendar
          - split
          - fridge
          - ledger
          - dtr
      source_run:
        description: Number of a successful private handoff run
        required: true
        type: string
      publish:
        description: Deploy this verified artifact to Cloudflare
        type: boolean
        default: false
      isolated:
        description: Verify an isolated Worker fixture in the separate validation environment
        type: boolean
        default: false
      bound_worker:
        description: Use the separate production environment for a Worker with an existing D1 binding
        type: boolean
        default: false

      routed_worker:
        description: Use the routed Worker verification or protected publication profile
        type: boolean
        default: false
      spa_worker:
        description: Use the SPA Worker verification or protected publication profile
        type: boolean
        default: false
      ledger_worker:
        description: Use the protected Ledger Worker profile
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: protected-worker-publish
  cancel-in-progress: false

jobs:
  select:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      profile: ${{ steps.app.outputs.profile }}
      environment: ${{ steps.app.outputs.environment }}
    steps:
      - id: app
        env:
          PROJECT: ${{ inputs.project }}
          LEDGER: ${{ inputs.ledger_worker }}
          SPA: ${{ inputs.spa_worker }}
          ROUTED: ${{ inputs.routed_worker }}
          BOUND: ${{ inputs.bound_worker }}
          ISOLATED: ${{ inputs.isolated }}
        run: |
          if [[ "$PROJECT" != legacy ]]; then
            for flag in "$LEDGER" "$SPA" "$ROUTED" "$BOUND" "$ISOLATED"; do
              [[ "$flag" == false ]] || exit 1
            done
          else
            PROJECT=fitness
            if [[ "$LEDGER" == true ]]; then PROJECT=ledger
            elif [[ "$SPA" == true ]]; then PROJECT=fridge
            elif [[ "$ROUTED" == true ]]; then PROJECT=split
            elif [[ "$BOUND" == true ]]; then PROJECT=calendar
            fi
          fi
          case "$PROJECT" in
            fitness) profile=production; environment=production ;;
            calendar) profile=bound-worker; environment=bound-worker-production ;;
            split) profile=routed-worker-production; environment=routed-worker-production ;;
            fridge) profile=spa-worker-production; environment=spa-worker-production ;;
            ledger) profile=ledger-worker-production; environment=spa-worker-production ;;
            dtr) profile=dtr-worker-production; environment=bound-worker-production ;;
            *) exit 1 ;;
          esac
          printf 'profile=%s\nenvironment=%s\n' "$profile" "$environment" >> "$GITHUB_OUTPUT"

  publish:
    needs: select
    if: github.ref == 'refs/heads/main' && (inputs.project != 'legacy' || (!inputs.isolated && ((inputs.ledger_worker && inputs.publish && !inputs.spa_worker && !inputs.routed_worker && !inputs.bound_worker) || (!inputs.ledger_worker && ((!inputs.spa_worker && (!inputs.routed_worker || (inputs.publish && !inputs.bound_worker))) || (inputs.spa_worker && inputs.publish && !inputs.routed_worker && !inputs.bound_worker))))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.select.outputs.environment }}
    env:
      HANDOFF_PROFILE: ${{ needs.select.outputs.profile }}
      SOURCE_RUN_ID: ${{ inputs.source_run }}
      SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
      SOURCE_WORKFLOW_BRANCH: ${{ needs.select.outputs.profile == 'dtr-worker-production' && secrets.DTR_WORKFLOW_BRANCH || needs.select.outputs.profile != 'dtr-worker-production' && (needs.select.outputs.profile == 'ledger-worker-production' && secrets.LEDGER_WORKFLOW_BRANCH || needs.select.outputs.profile != 'ledger-worker-production' && secrets.SOURCE_WORKFLOW_BRANCH) }}
      SOURCE_WORKFLOW_SHA: ${{ needs.select.outputs.profile == 'dtr-worker-production' && secrets.DTR_WORKFLOW_SHA || needs.select.outputs.profile != 'dtr-worker-production' && (needs.select.outputs.profile == 'ledger-worker-production' && secrets.LEDGER_WORKFLOW_SHA || needs.select.outputs.profile != 'ledger-worker-production' && secrets.SOURCE_WORKFLOW_SHA) }}
      WORKER_NAME: ${{ needs.select.outputs.profile == 'dtr-worker-production' && secrets.DTR_WORKER_NAME || needs.select.outputs.profile != 'dtr-worker-production' && (needs.select.outputs.profile == 'ledger-worker-production' && secrets.LEDGER_WORKER_NAME || needs.select.outputs.profile != 'ledger-worker-production' && secrets.WORKER_NAME) }}
      WORKER_DATABASE_ID: ${{ needs.select.outputs.profile == 'dtr-worker-production' && secrets.DTR_DATABASE_ID || needs.select.outputs.profile != 'dtr-worker-production' && (needs.select.outputs.profile == 'ledger-worker-production' && secrets.LEDGER_DATABASE_ID || needs.select.outputs.profile != 'ledger-worker-production' && secrets.WORKER_DATABASE_ID) }}
      WORKER_DATABASE_NAME: ${{ needs.select.outputs.profile == 'spa-worker-production' && secrets.WORKER_DATABASE_NAME }}
      WORKER_SERVICE: ${{ needs.select.outputs.profile == 'routed-worker-production' && secrets.WORKER_SERVICE }}
      WORKER_ENTRYPOINT: ${{ needs.select.outputs.profile == 'routed-worker-production' && secrets.WORKER_ENTRYPOINT }}
    steps:
      - name: Check out the exact protected workflow revision
        run: |
          git init --quiet
          git fetch --quiet --depth=1 --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Confirm the handoff token repository scope
        env:
          CONTROLLER_REPOSITORY: ${{ secrets.HANDOFF_APP_REPOSITORY }}
        run: |
          [[ "$CONTROLLER_REPOSITORY" =~ ^[A-Za-z0-9_.-]+$ ]]
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY_OWNER/$CONTROLLER_REPOSITORY"
      - name: Mint a read-only handoff installation token
        id: handoff-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.HANDOFF_APP_CLIENT_ID }}
          private-key: ${{ secrets.HANDOFF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.HANDOFF_APP_REPOSITORY }}
          permission-actions: read
      - name: Verify privately built artifact
        id: approval
        env:
          HANDOFF_ACTIONS_READ: ${{ steps.handoff-token.outputs.token }}
          RECORD_ARTIFACT_APPROVAL: 'true'
        run: python3 publisher.py
      - if: inputs.publish
        env:
          APPROVED_ARTIFACT: ${{ steps.approval.outputs.artifact }}
        run: |
          [[ -n "$APPROVED_ARTIFACT" ]]
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          npm install --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund wrangler@4.156.0
      - name: Deploy privately built artifact
        if: inputs.publish
        env:
          PUBLISH: 'true'
          HANDOFF_ACTIONS_READ: ${{ steps.handoff-token.outputs.token }}
          APPROVED_ARTIFACT: ${{ steps.approval.outputs.artifact }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ needs.select.outputs.profile == 'dtr-worker-production' && secrets.DTR_CLOUDFLARE_API_TOKEN || needs.select.outputs.profile != 'dtr-worker-production' && (needs.select.outputs.profile == 'ledger-worker-production' && secrets.LEDGER_CLOUDFLARE_API_TOKEN || needs.select.outputs.profile != 'ledger-worker-production' && secrets.CLOUDFLARE_API_TOKEN) }}
        run: |
          export WRANGLER_BIN="$RUNNER_TEMP/wrangler/node_modules/wrangler/bin/wrangler.js"
          python3 publisher.py

  isolated:
    if: github.ref == 'refs/heads/main' && inputs.project == 'legacy' && !inputs.publish && !inputs.bound_worker && ((inputs.ledger_worker && !inputs.isolated && !inputs.spa_worker && !inputs.routed_worker) || (!inputs.ledger_worker && ((!inputs.spa_worker && inputs.isolated != inputs.routed_worker) || (inputs.spa_worker && !inputs.isolated && !inputs.routed_worker))))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: handoff-validation
    steps:
      - name: Check out the exact protected workflow revision
        run: |
          git init --quiet
          git fetch --quiet --depth=1 --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Confirm the handoff token repository scope
        env:
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          CONTROLLER_REPOSITORY: ${{ secrets.HANDOFF_APP_REPOSITORY }}
        run: |
          [[ "$CONTROLLER_REPOSITORY" =~ ^[A-Za-z0-9_.-]+$ ]]
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY_OWNER/$CONTROLLER_REPOSITORY"
      - name: Mint a read-only handoff installation token
        id: handoff-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.HANDOFF_APP_CLIENT_ID }}
          private-key: ${{ secrets.HANDOFF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.HANDOFF_APP_REPOSITORY }}
          permission-actions: read
      - name: Verify the private artifact without deployment
        env:
          HANDOFF_PROFILE: ${{ inputs.ledger_worker && 'ledger-worker-production' || inputs.spa_worker && 'spa-worker' || inputs.routed_worker && 'routed-worker' || 'isolated' }}
          SOURCE_RUN_ID: ${{ inputs.source_run }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_WORKFLOW_BRANCH: ${{ inputs.ledger_worker && secrets.LEDGER_WORKFLOW_BRANCH || !inputs.ledger_worker && (inputs.spa_worker && secrets.SPA_WORKFLOW_BRANCH || inputs.routed_worker && secrets.ROUTED_WORKFLOW_BRANCH || secrets.SOURCE_WORKFLOW_BRANCH) }}
          SOURCE_WORKFLOW_SHA: ${{ inputs.ledger_worker && secrets.LEDGER_WORKFLOW_SHA || !inputs.ledger_worker && (inputs.spa_worker && secrets.SPA_WORKFLOW_SHA || inputs.routed_worker && secrets.ROUTED_WORKFLOW_SHA || secrets.SOURCE_WORKFLOW_SHA) }}
          HANDOFF_ACTIONS_READ: ${{ steps.handoff-token.outputs.token }}
          WORKER_NAME: ${{ inputs.ledger_worker && secrets.LEDGER_WORKER_NAME || !inputs.ledger_worker && (inputs.spa_worker && secrets.SPA_WORKER_NAME || inputs.routed_worker && secrets.ROUTED_WORKER_NAME || secrets.WORKER_NAME) }}
          WORKER_DATABASE_ID: ${{ inputs.ledger_worker && secrets.LEDGER_DATABASE_ID || !inputs.ledger_worker && (inputs.spa_worker && secrets.SPA_DATABASE_ID || inputs.routed_worker && secrets.ROUTED_DATABASE_ID || secrets.WORKER_DATABASE_ID) }}
          WORKER_DATABASE_NAME: ${{ inputs.spa_worker && secrets.SPA_DATABASE_NAME }}
          WORKER_SERVICE: ${{ inputs.routed_worker && secrets.ROUTED_SERVICE }}
          WORKER_ENTRYPOINT: ${{ inputs.routed_worker && secrets.ROUTED_ENTRYPOINT }}
        run: python3 publisher.py
