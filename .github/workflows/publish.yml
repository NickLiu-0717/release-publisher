name: Verify or publish approved artifact
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Number of a successful private handoff run
        required: true
        type: string
      publish:
        description: Deploy this verified artifact to Cloudflare
        type: boolean
        default: false
      isolated:
        description: Verify an isolated Worker fixture in the separate validation environment
        type: boolean
        default: false
      bound_worker:
        description: Use the separate production environment for a Worker with an existing D1 binding
        type: boolean
        default: false

      routed_worker:
        description: Use the routed Worker verification or protected publication profile
        type: boolean
        default: false
      spa_worker:
        description: Verify a Worker with SPA asset fallback without deployment
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: protected-worker-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && !inputs.spa_worker && !inputs.isolated && (!inputs.routed_worker || (inputs.publish && !inputs.bound_worker))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.routed_worker && 'routed-worker-production' || inputs.bound_worker && 'bound-worker-production' || 'production' }}
    env:
      HANDOFF_PROFILE: ${{ inputs.routed_worker && 'routed-worker-production' || inputs.bound_worker && 'bound-worker' || 'production' }}
      SOURCE_RUN_ID: ${{ inputs.source_run }}
      SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
      SOURCE_WORKFLOW_BRANCH: ${{ secrets.SOURCE_WORKFLOW_BRANCH }}
      SOURCE_WORKFLOW_SHA: ${{ secrets.SOURCE_WORKFLOW_SHA }}
      WORKER_NAME: ${{ secrets.WORKER_NAME }}
    steps:
      - name: Check out the exact protected workflow revision
        run: |
          git init --quiet
          git fetch --quiet --depth=1 --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Confirm the handoff token repository scope
        env:
          CONTROLLER_REPOSITORY: ${{ secrets.HANDOFF_APP_REPOSITORY }}
        run: |
          [[ "$CONTROLLER_REPOSITORY" =~ ^[A-Za-z0-9_.-]+$ ]]
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY_OWNER/$CONTROLLER_REPOSITORY"
      - name: Mint a read-only handoff installation token
        id: handoff-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.HANDOFF_APP_CLIENT_ID }}
          private-key: ${{ secrets.HANDOFF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.HANDOFF_APP_REPOSITORY }}
          permission-actions: read
      - if: inputs.publish
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          npm install --prefix "$RUNNER_TEMP/wrangler" --ignore-scripts --no-audit --no-fund wrangler@4.156.0
      - name: Verify privately built artifact
        if: ${{ !inputs.publish }}
        env:
          HANDOFF_ACTIONS_READ: ${{ steps.handoff-token.outputs.token }}
          WORKER_DATABASE_ID: ${{ secrets.WORKER_DATABASE_ID }}
        run: python3 publisher.py
      - name: Deploy privately built artifact
        if: inputs.publish
        env:
          PUBLISH: 'true'
          HANDOFF_ACTIONS_READ: ${{ steps.handoff-token.outputs.token }}
          WORKER_DATABASE_ID: ${{ secrets.WORKER_DATABASE_ID }}
          WORKER_SERVICE: ${{ inputs.routed_worker && secrets.WORKER_SERVICE }}
          WORKER_ENTRYPOINT: ${{ inputs.routed_worker && secrets.WORKER_ENTRYPOINT }}
          APPROVED_ARTIFACT_DIGEST: ${{ inputs.routed_worker && secrets.APPROVED_ARTIFACT_DIGEST }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          export WRANGLER_BIN="$RUNNER_TEMP/wrangler/node_modules/wrangler/bin/wrangler.js"
          python3 publisher.py

  isolated:
    if: github.ref == 'refs/heads/main' && !inputs.publish && !inputs.bound_worker && ((!inputs.spa_worker && inputs.isolated != inputs.routed_worker) || (inputs.spa_worker && !inputs.isolated && !inputs.routed_worker))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: handoff-validation
    steps:
      - name: Check out the exact protected workflow revision
        run: |
          git init --quiet
          git fetch --quiet --depth=1 --no-tags "https://github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --quiet --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Confirm the handoff token repository scope
        env:
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          CONTROLLER_REPOSITORY: ${{ secrets.HANDOFF_APP_REPOSITORY }}
        run: |
          [[ "$CONTROLLER_REPOSITORY" =~ ^[A-Za-z0-9_.-]+$ ]]
          test "$SOURCE_REPOSITORY" = "$GITHUB_REPOSITORY_OWNER/$CONTROLLER_REPOSITORY"
      - name: Mint a read-only handoff installation token
        id: handoff-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc
        with:
          client-id: ${{ vars.HANDOFF_APP_CLIENT_ID }}
          private-key: ${{ secrets.HANDOFF_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ secrets.HANDOFF_APP_REPOSITORY }}
          permission-actions: read
      - name: Verify the private artifact without deployment
        env:
          HANDOFF_PROFILE: ${{ inputs.spa_worker && 'spa-worker' || inputs.routed_worker && 'routed-worker' || 'isolated' }}
          SOURCE_RUN_ID: ${{ inputs.source_run }}
          SOURCE_REPOSITORY: ${{ secrets.SOURCE_REPOSITORY }}
          SOURCE_WORKFLOW_BRANCH: ${{ inputs.spa_worker && secrets.SPA_WORKFLOW_BRANCH || inputs.routed_worker && secrets.ROUTED_WORKFLOW_BRANCH || secrets.SOURCE_WORKFLOW_BRANCH }}
          SOURCE_WORKFLOW_SHA: ${{ inputs.spa_worker && secrets.SPA_WORKFLOW_SHA || inputs.routed_worker && secrets.ROUTED_WORKFLOW_SHA || secrets.SOURCE_WORKFLOW_SHA }}
          HANDOFF_ACTIONS_READ: ${{ steps.handoff-token.outputs.token }}
          WORKER_NAME: ${{ inputs.spa_worker && secrets.SPA_WORKER_NAME || inputs.routed_worker && secrets.ROUTED_WORKER_NAME || secrets.WORKER_NAME }}
          WORKER_DATABASE_ID: ${{ inputs.spa_worker && secrets.SPA_DATABASE_ID || inputs.routed_worker && secrets.ROUTED_DATABASE_ID || secrets.WORKER_DATABASE_ID }}
          WORKER_DATABASE_NAME: ${{ inputs.spa_worker && secrets.SPA_DATABASE_NAME }}
          WORKER_SERVICE: ${{ inputs.routed_worker && secrets.ROUTED_SERVICE }}
          WORKER_ENTRYPOINT: ${{ inputs.routed_worker && secrets.ROUTED_ENTRYPOINT }}
        run: python3 publisher.py
